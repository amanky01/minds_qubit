services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  core:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      MONGODB_URL: mongodb://mongodb:27017
      CENTRAL_DB_NAME: mindsqubit_core
      JWT_SECRET_KEY: dev_secret_change_in_production
      CORS_ORIGINS: http://localhost:3000
      AGENT_SERVICE_API_KEY: dev_agent_service_key
      AGENT_CODECRAFT_URL: http://codecraft:8010
      AGENT_DATAVIZ_URL: http://dataviz:8011
      AGENT_CONTENTCREATOR_URL: http://contentcreator:8012
      AGENT_DESIGNMASTER_URL: http://designmaster:8013
      AGENT_LANGUAGETUTOR_URL: http://languagetutor:8014
      AGENT_RESEARCHPRO_URL: http://researchpro:8015
      AGENT_TECHBLOG_URL: http://techblog:8016
      AGENT_OPPORTUNITYALERT_URL: http://opportunityalert:8017
    depends_on:
      - mongodb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  codecraft:
    build:
      context: .
      dockerfile: services/agents/Dockerfile.chat
      args:
        AGENT_DIR: codecraft
        AGENT_PORT: "8010"
    ports:
      - "8010:8010"
    environment:
      AGENT_ID: codecraft
      PORT: "8010"
      MONGODB_URL: mongodb://mongodb:27017
      AGENT_SERVICE_API_KEY: dev_agent_service_key
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      - mongodb

  dataviz:
    build:
      context: .
      dockerfile: services/agents/Dockerfile.chat
      args:
        AGENT_DIR: dataviz
        AGENT_PORT: "8011"
