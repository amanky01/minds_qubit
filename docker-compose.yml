    environment:
      AGENT_ID: dataviz
      PORT: "8011"
      MONGODB_URL: mongodb://mongodb:27017
      AGENT_SERVICE_API_KEY: dev_agent_service_key
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    depends_on:
      - mongodb

  contentcreator:
