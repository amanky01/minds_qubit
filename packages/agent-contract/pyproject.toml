[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-contract"
version = "1.0.0"
description = "Shared request/response schemas for MindsQubit agent microservices"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.9,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
